<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J.A.R.V.I.S. | Arc Reactor</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:radial-gradient(circle,#092849,#020711 65%,#000);color:#65eaff;font-family:Consolas,monospace}
#hud{position:fixed;inset:0;pointer-events:none;background:linear-gradient(transparent 49.9%,#29caff12 50%,transparent 50.1%),linear-gradient(90deg,transparent 49.9%,#29caff12 50%,transparent 50.1%);background-size:100% 100%}
header{position:absolute;top:24px;left:28px;right:28px;display:flex;justify-content:space-between;letter-spacing:3px;font-size:14px}
small{display:block;font-size:9px;margin-top:8px;letter-spacing:2px;color:#429bbd}
#status{text-align:right;font-size:10px;line-height:2}
#reactor{position:absolute;width:min(72vw,72vh,580px);aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%);filter:drop-shadow(0 0 20px #008cff);transition:filter .2s}
svg{width:100%;height:100%}
.spin{transform-origin:300px 300px;animation:spin 18s linear infinite}
.reverse{transform-origin:300px 300px;animation:spin 12s linear infinite reverse}
.pulse{animation:pulse 2s ease-in-out infinite alternate;transform-origin:300px 300px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{from{opacity:.6;transform:scale(.97)}to{opacity:1;transform:scale(1.03)}}
#reactor.active{filter:drop-shadow(0 0 45px #00d9ff)}
#label{position:absolute;top:calc(50% + min(36vw,36vh,290px));left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:4px;white-space:nowrap}
#bottom{position:absolute;bottom:24px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:end;gap:12px}
button{background:#061b30;color:#72eaff;border:1px solid #168ab8;padding:10px;font:10px Consolas;letter-spacing:1px;cursor:pointer}
button:hover{background:#10405b}
#buttons{display:flex;flex-wrap:wrap;gap:7px;max-width:75%}
#message{font-size:10px;text-align:right;max-width:260px;line-height:1.7}
#video{position:fixed;right:20px;bottom:100px;width:130px;opacity:.18;transform:scaleX(-1);display:none}
@media(max-width:650px){header{left:15px;right:15px;top:15px;font-size:11px}#bottom{left:12px;right:12px;bottom:12px;display:block}#buttons{max-width:100%;margin-bottom:12px}#message{text-align:left;max-width:100%}#reactor{width:88vw}#label{top:calc(50% + 42vw);font-size:8px}}
</style>
</head>
<body>
<div id="hud"></div>
<header>
<div>J.A.R.V.I.S.<small>JUST A RATHER VERY INTELLIGENT SYSTEM</small></div>
<div id="status">SYSTEM: <span id="sys">STANDBY</span><br>ARC CORE: ONLINE<br>CAMERA: <span id="cam">OFFLINE</span></div>
</header>

<div id="reactor">
<svg viewBox="0 0 600 600">
<defs>
<radialGradient id="core"><stop stop-color="white"/><stop offset=".22" stop-color="#a9ffff"/><stop offset=".55" stop-color="#12cfff"/><stop offset="1" stop-color="#06418d"/></radialGradient>
<linearGradient id="ring"><stop stop-color="#d8ffff"/><stop offset=".5" stop-color="#0aa9ff"/><stop offset="1" stop-color="#62f3ff"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<circle cx="300" cy="300" r="282" fill="none" stroke="#1267a0" stroke-dasharray="2 12"/>
<g class="spin" fill="none" stroke="url(#ring)" filter="url(#glow)">
<circle cx="300" cy="300" r="250" stroke-width="3" stroke-dasharray="65 12 18 8"/>
<circle cx="300" cy="300" r="224" stroke-width="2" stroke-dasharray="3 9"/>
<circle cx="300" cy="300" r="196" stroke-width="8" stroke-dasharray="90 14 25 12"/>
<path d="M300 30V85 M300 515V570 M30 300H85 M515 300H570" stroke-width="4"/>
</g>
<g class="reverse" fill="none" stroke="#4aeaff" filter="url(#glow)">
<circle cx="300" cy="300" r="170" stroke-width="2" stroke-dasharray="22 7 4 7"/>
<circle cx="300" cy="300" r="151" stroke-width="7" stroke-dasharray="35 10"/>
</g>
<g class="pulse">
<circle cx="300" cy="300" r="130" fill="#041b3a" stroke="#6af3ff" stroke-width="3" filter="url(#glow)"/>
<circle cx="300" cy="300" r="108" fill="none" stroke="#1ab9ff" stroke-width="7" stroke-dasharray="20 7"/>
<path d="M300 210L325 253L366 260L340 295L350 337L300 318L250 337L260 295L234 260L275 253Z" fill="#0878c9" stroke="#6ff7ff" stroke-width="3"/>
<circle cx="300" cy="300" r="68" fill="url(#core)" filter="url(#glow)"/>
<circle cx="300" cy="300" r="40" fill="none" stroke="white" stroke-width="2"/>
<circle cx="300" cy="300" r="15" fill="white"/>
</g>
<g fill="#a8faff"><circle cx="300" cy="70" r="4"/><circle cx="300" cy="530" r="4"/><circle cx="70" cy="300" r="4"/><circle cx="530" cy="300" r="4"/></g>
</svg>
</div>
<div id="label">ARC REACTOR // ONLINE</div>
<video id="video" autoplay playsinline muted></video>

<div id="bottom">
<div id="buttons">
<button id="cameraBtn">START HAND TRACKING</button>
<button id="voiceBtn">ACTIVATE VOICE</button>
<button onclick="center()">RECENTER</button>
<button onclick="pulse()">ARC PULSE</button>
<button onclick="fullscreen()">FULLSCREEN</button>
</div>
<div id="message">JARVIS: At your service, sir.</div>
</div>

<script>
const reactor=document.getElementById('reactor');
const message=document.getElementById('message');
const video=document.getElementById('video');
let stream=null,tracking=false,voice=false,recognition=null;
let tx=.5,ty=.5,x=.5,y=.5,lastPulse=0;

function say(t,speak=true){
 message.textContent='JARVIS: '+t;
 if(speak&&'speechSynthesis'in window){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(t);
  u.rate=1.05;u.pitch=.9;speechSynthesis.speak(u);
 }
}
function center(){tx=.5;ty=.5;say('Arc reactor centered.')}
function pulse(){
 reactor.classList.add('active');
 say('Arc reactor energy pulse initiated.');
 setTimeout(()=>reactor.classList.remove('active'),900);
}
function fullscreen(){
 if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});
 else document.exitFullscreen?.();
}
function move(a,b){
 tx=Math.max(.12,Math.min(.88,a));
 ty=Math.max(.18,Math.min(.8,b));
}
document.addEventListener('pointermove',e=>{
 if(!tracking)move(e.clientX/innerWidth,e.clientY/innerHeight);
});
function animate(){
 x+=(tx-x)*.12;y+=(ty-y)*.12;
 reactor.style.left=(x*100)+'%';
 reactor.style.top=(y*100)+'%';
 requestAnimationFrame(animate);
}
animate();

async function startCamera(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
  video.srcObject=stream;await video.play();
  video.style.display='block';
  document.getElementById('cam').textContent='CONNECTED';
  say('Camera connected. Loading hand tracking.',false);
  const mp=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
  const files=await mp.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const hands=await mp.HandLandmarker.createFromOptions(files,{
   baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},
   runningMode:'VIDEO',numHands:1
  });
  tracking=true;
  document.getElementById('cameraBtn').textContent='STOP HAND TRACKING';
  document.getElementById('sys').textContent='ACTIVE';
  say('Hand tracking online. Move your hand to control the reactor.');
  function detect(){
   if(!tracking)return;
   if(video.readyState>=2){
    const result=hands.detectForVideo(video,performance.now());
    if(result.landmarks&&result.landmarks.length){
     const p=result.landmarks[0];
     move(1-p[9].x,p[9].y);
     const tips=[8,12,16,20],bases=[5,9,13,17];
     let extended=0;
     for(let i=0;i<4;i++)if(p[tips[i]].y<p[bases[i]].y)extended++;
     if(extended===0&&Date.now()-lastPulse>1800){lastPulse=Date.now();pulse();}
    }
   }
   requestAnimationFrame(detect);
  }
  detect();
 }catch(e){
  document.getElementById('cam').textContent='ERROR';
  say('Camera error: '+e.name+'. Check Chrome camera permissions and close other camera apps.',false);
  console.error(e);
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;
 }
}
function stopCamera(){
 tracking=false;
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;video.style.display='none';
 document.getElementById('cam').textContent='OFFLINE';
 document.getElementById('cameraBtn').textContent='START HAND TRACKING';
 say('Hand tracking stopped. Pointer control active.');
}
document.getElementById('cameraBtn').onclick=()=>tracking?stopCamera():startCamera();

function runCommand(s){
 s=s.toLowerCase();
 if(s.includes('time'))say('The time is '+new Date().toLocaleTimeString());
 else if(s.includes('date'))say('Today is '+new Date().toLocaleDateString());
 else if(s.includes('hello')||s.includes('jarvis'))say('At your service, sir.');
 else if(s.includes('center')||s.includes('reset'))center();
 else if(s.includes('pulse')||s.includes('power up'))pulse();
 else if(s.includes('fullscreen'))fullscreen();
 else if(s.includes('study mode'))say('Study mode activated.');
 else if(s.includes('coding mode'))say('Coding mode activated.');
 else if(s.includes('open youtube')){say('Opening YouTube.');window.open('https://youtube.com','_blank');}
 else if(s.includes('open google')){say('Opening Google.');window.open('https://google.com','_blank');}
 else if(s.includes('open github')){say('Opening GitHub.');window.open('https://github.com','_blank');}
 else say('Command received: '+s);
}
function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){say('Voice recognition is not supported in this browser.');return}
 recognition=new SR();
 recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=false;
 recognition.onstart=()=>{voice=true;document.getElementById('voiceBtn').textContent='STOP VOICE';say('Voice control active. I am listening.',false)};
 recognition.onresult=e=>runCommand(e.results[e.results.length-1][0].transcript);
 recognition.onerror=e=>say('Voice error: '+e.error);
 recognition.onend=()=>{if(voice)try{recognition.start()}catch(e){}};
 try{recognition.start()}catch(e){say('Could not start voice input.')}
}
function stopVoice(){
 voice=false;
 if(recognition){recognition.onend=null;recognition.stop();recognition=null}
 document.getElementById('voiceBtn').textContent='ACTIVATE VOICE';
 say('Voice control stopped.',false);
}
document.getElementById('voiceBtn').onclick=()=>voice?stopVoice():startVoice();
document.addEventListener('keydown',e=>{
 if(e.key.toLowerCase()==='c')center();
 if(e.key.toLowerCase()==='p')pulse();
});
</script>
</body>
</html>
